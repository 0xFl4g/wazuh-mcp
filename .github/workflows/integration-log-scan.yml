name: integration-log-scan

# Artifacts from the triggering runs are treated as data only: never executed
# or interpolated into shell, only scanned by gitleaks. The source workflows
# are schedule/dispatch only, so no PR-controlled input reaches this one.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] read-only artifact scan; checks out default branch, never PR code
    workflows: ["integration", "destructive-integration", "multi-manager-integration"]
    types: [completed]

permissions:
  contents: read

env:
  # Opt into Node 24 for JS actions ahead of GitHub's June 2026 forced default.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all integration log artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: '*-logs-*'
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: |
          find artifacts/ -type f -name '*.log' | head -50

      - name: Install gitleaks (pinned sha256)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: Scan log artifacts
        run: |
          if [ ! -d artifacts ] || [ -z "$(find artifacts -type f 2>/dev/null)" ]; then
            echo "No artifacts to scan; skipping."
            exit 0
          fi
          ./gitleaks dir artifacts/ \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks-logs.sarif \
            --verbose

      - name: Upload SARIF to GH Security tab
        # The SARIF upload step requires GitHub Code Scanning to be enabled
        # on the repo. When it is not (default on new private repos), the
        # upload errors with 'Code scanning is not enabled'. The actual
        # operational signal is the gitleaks scan exit code above; this
        # upload is a UI nice-to-have, so its failure must not fail the
        # workflow.
        if: always() && hashFiles('gitleaks-logs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks-logs.sarif
          category: integration-log-scan

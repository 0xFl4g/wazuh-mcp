version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories: ["/", "/docker/wazuh-agent"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories: ["/", "/docker/wazuh-agent"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The wazuh-agent test image tracks Ubuntu LTS only; LTS moves are
      # planned by hand (Dependabot proposed non-LTS 25.10 in #54).
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
